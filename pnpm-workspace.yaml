# Dependency build scripts are opt-in (pnpm 10+, `allowBuilds` map since 11).
#
# esbuild ships its native binary through an install script, and the Angular
# build pipeline is esbuild underneath, so without it `ng build` fails at first
# use rather than at install.
#
# The other three are denied on purpose. Their scripts only compile a native
# addon from source when no prebuilt binary matches the platform, and every
# platform we build on gets one from an optional dependency
# (`@lmdb/lmdb-win32-x64` and friends), loaded at require time without the
# script. A postinstall is arbitrary code execution at `pnpm install` time, and
# none of these has earned it.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  lmdb: false
  msgpackr-extract: false

# TanStack Query looks `PendingTasks` up on the whole `@angular/core` namespace,
# to support Angular 16 to 18, which lack it. A namespace used as a value
# cannot be tree-shaken, so every export of Angular landed in the first load:
# 160 kB more on every page, for a dialog most visits never open. The patch
# imports it by name. It is keyed by package, not version, so an upgrade that
# touches the file fails the install instead of dropping the fix unnoticed.
patchedDependencies:
  '@tanstack/angular-query-experimental': patches/@tanstack__angular-query-experimental.patch
