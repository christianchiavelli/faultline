<figure class="helicorder">
  <div class="scale mono" aria-hidden="true">
    <span class="scale__corner">UTC</span>
    <span style="--at: 0%">:00</span>
    <span style="--at: 25%">:15</span>
    <span style="--at: 50%">:30</span>
    <span style="--at: 75%">:45</span>
    <span style="--at: 100%">:60</span>
  </div>

  <div class="drum">
    <ol class="hours mono" role="list" aria-hidden="true">
      @for (hour of hourLabels(); track hour.start) {
        <li [class.hours__current]="hour.current" [class.hours__read]="reading()?.row === $index">
          {{ hour.text }}
        </li>
      }
    </ol>

    <div class="paper" #paper (pointerleave)="leave($event)">
      @if (reading(); as reading) {
        <div class="band" [style.--top]="reading.top" [style.--line]="line"></div>
      }

      <svg
        class="trace"
        [class.trace--waiting]="waiting()"
        [attr.viewBox]="viewBox"
        preserveAspectRatio="none"
        aria-hidden="true"
        focusable="false"
      >
        <g class="grid">
          @for (x of gridLines; track x) {
            <line
              [attr.x1]="x"
              [attr.x2]="x"
              y1="0"
              [attr.y2]="height"
              [class.grid__major]="x % quarterHour === 0"
            />
          }
        </g>
        @for (row of rows(); track row.start) {
          <path class="ink" [attr.d]="row.ink" />
          @for (segment of row.pen; track $index) {
            <path class="pen" [attr.d]="segment" />
          }
        }
      </svg>

      @if (placed().length) {
        <div
          class="reader"
          [class.reader--over]="reading()?.source === 'pointer'"
          role="slider"
          tabindex="0"
          aria-label="Events on the trace"
          i18n-aria-label="accessible name of the slider that steps through the events on the trace"
          aria-valuemin="1"
          [attr.aria-valuemax]="placed().length"
          [attr.aria-valuenow]="position() + 1"
          [attr.aria-valuetext]="positionText()"
          [attr.aria-describedby]="hintId"
          (pointermove)="hover($event)"
          (pointerdown)="press($event)"
          (click)="open($event)"
          (keydown)="key($event)"
          (focus)="focused($event)"
          (blur)="blurred()"
        ></div>
      }

      @if (reading(); as reading) {
        <span
          class="pick"
          [class.pick--pen]="reading.pen"
          [class.pick--below]="reading.below"
          [style.--at]="reading.at"
          [style.--top]="reading.top"
          [style.--line]="line"
        ></span>
        <span
          class="origin"
          [class.origin--pen]="reading.pen"
          [style.--at]="reading.at"
          [style.--top]="reading.top"
          [style.--line]="line"
        ></span>
      }

      @for (marker of markers(); track marker.id) {
        <a
          #markerLink
          class="marker mono"
          [routerLink]="['/quakes', marker.id]"
          [state]="marker.link"
          [info]="markerLink"
          [attr.data-magnitude-of]="marker.id"
          [style.--at]="marker.left"
          [style.top.%]="marker.top"
          [attr.aria-label]="marker.label"
          (pointerenter)="readMarker($event, marker.id)"
          >{{ marker.text }}</a
        >
      }

      <span class="pen-head" [style.left.%]="pen().left" [style.top.%]="pen().top"></span>

      <!-- Seen, not heard: the slider's value says the same to a screen reader. -->
      @if (reading(); as reading) {
        <div
          class="card"
          [class.card--pen]="reading.pen"
          [class.card--below]="reading.below"
          [style.--at]="reading.at"
          [style.--top]="reading.top"
          [style.--line]="line"
          aria-hidden="true"
        >
          <p class="card__head">
            @if (reading.magnitude; as magnitude) {
              <span class="card__magnitude mono" [attr.data-magnitude-of]="reading.id"
                >M{{ magnitude.value
                }}<abbr [title]="magnitude.scale.title">{{ magnitude.scale.code }}</abbr></span
              >
            } @else {
              <span class="card__magnitude mono missing">—</span>
            }
            <span class="card__time mono">{{ reading.time | date: 'HH:mm:ss' : 'UTC' }} UTC</span>
          </p>
          <a
            #cardPlace
            class="card__place"
            [routerLink]="['/quakes', reading.id]"
            [state]="reading.link"
            [info]="cardPlace"
            tabindex="-1"
            >{{ reading.place }}</a
          >
          <p class="card__meta">
            @if (reading.depth; as depth) {
              @if (depth.above) {
                <span i18n="an event's height above sea level, on the trace's card"
                  ><span class="mono">{{ depth.km }} km</span> above sea level</span
                >
              } @else {
                <span i18n="an event's depth, on the trace's card"
                  ><span class="mono">{{ depth.km }} km</span> deep</span
                >
              }
            } @else {
              <span i18n="an event's depth, unknown, on the trace's card"
                >Depth <span class="missing">—</span></span
              >
            }
            @if (reading.kind; as kind) {
              <span class="tag card__kind">{{ kind }}</span>
            }
            <span class="tag" [class]="reading.reviewed ? 'tag--solid' : 'tag--dashed'">{{
              reading.review
            }}</span>
          </p>
          @if (reading.source === 'keyboard') {
            <p class="card__keys">
              <span
                ><kbd>←</kbd><kbd>→</kbd
                ><ng-container i18n="what the arrow keys do on the trace's card"
                  >Other events</ng-container
                ></span
              >
              <span
                ><kbd>Enter</kbd
                ><ng-container i18n="what the Enter key does on the trace's card"
                  >Open</ng-container
                ></span
              >
              <span
                ><kbd>Esc</kbd
                ><ng-container i18n="what the Escape key does on the trace's card"
                  >Close</ng-container
                ></span
              >
            </p>
          }
        </div>
      }
    </div>
  </div>

  <p class="visually-hidden" [id]="hintId" i18n="how to use the slider over the trace, read out">
    The arrow keys go from event to event, and Enter opens the one read.
  </p>

  <figcaption class="legend">
    <span class="legend__item" i18n="key of the trace: how to read its lines"
      >One line per hour, read left to right, top to bottom.</span
    >
    <span class="legend__item" i18n="key of the trace: what a spike is and how tall it grows">
      Each spike is one event. Height grows about 3× per magnitude step, a compressed scale: ground
      motion really grows 10×.
    </span>
    <span
      class="legend__item legend__item--pen"
      i18n="key of the trace: the magnitude from which the pen draws in red"
      >Red: M{{ notable }} and above.</span
    >
    <span class="legend__item" i18n="key of the trace: it is drawn, not recorded by a station">
      A synthetic record drawn from the USGS catalogue, not a waveform from any station.
    </span>
  </figcaption>
</figure>
