name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run irrelevant. Cancelling
# it frees the runner instead of paying for a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Only to start pnpm: the runtime the scripts use is pinned by
      # `devEngines` and downloaded by the install, like on a laptop.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Checks and unit tests
        run: pnpm run ci

      # Every message of the templates translated into Portuguese, and none left over.
      - name: Translations
        run: pnpm run i18n

      # Last, because it is the slowest and a failure above already says more.
      - name: Production build
        run: pnpm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only the browser the suite runs, plus the system libraries a bare runner lacks.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and run
        run: pnpm e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # A runner of its own: a measurement shares the machine with nothing else.
  vitals:
    name: Web Vitals
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Fails when a page measures worse than its baseline; the table lands in the run's summary.
      - name: Build and measure
        run: pnpm vitals

      # What `pnpm vitals:accept` takes as the next baseline.
      - name: Upload the measurement
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-vitals
          path: vitals-report/
          retention-days: 90
